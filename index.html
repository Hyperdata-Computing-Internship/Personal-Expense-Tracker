<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> 
        <header> 
            <h1>Expense Tracker</h1> 
            <p>Keep track of your daily expenses</p> 
        </header>
        <section class="summary"> 
            <div class="summary-card"> 
                <h3>Total Expenses</h3> 
                <p id="total-expenses">Rs. 0</p> 
            </div> 
            <div class="summary-card"> 
                <h3>Food</h3> 
                <p id="food-expenses">Rs. 0</p> 
            </div> 
            <div class="summary-card"> 
                <h3>Transport</h3> 
                <p id="transport-expenses">Rs. 0</p> 
            </div> 
        </section>
        <section class="expense-form"> 
            <h2>Add Expense</h2> 
            <form id="expense-form"> 
                <div class="form-group"> 
                    <label for="expense-name">Expense Name</label> 
                    <input type="text" id="expense-name" placeholder="e.g. Lunch" > 
                </div> 
                <div class="form-group"> 
                    <label for="expense-amount">Amount</label> 
                    <input type="number" id="expense-amount" placeholder="e.g. 500" > 
                </div> 
                <div class="form-group"> 
                    <label for="expense-category">Category</label> 
                    <select id="expense-category"> 
                        <option value="Food">Food</option> 
                        <option value="Transport">Transport</option> 
                        <option value="Bills">Bills</option> 
                        <option value="Shopping">Shopping</option> 
                        <option value="Other">Other</option> 
                    </select> 
                </div> 
                <div class="form-group"> 
                    <label for="expense-date">Date</label> 
                    <input type="date" id="expense-date" > 
                </div> 
                <button type="submit">Add Expense</button> 
            </form> 
        </section> 
    </div>
    <section class="expense-section"> 
        <div class="expense-header">
            <h2>My Expenses</h2> 
            <select id="filter-category"> 
                <option value="All">All Categories</option>
                <option value="Food">Food</option> 
                <option value="Transport">Transport</option> 
                <option value="Bills">Bills</option> 
                <option value="Shopping">Shopping</option> 
                <option value="Other">Other</option> 
            </select> 
        </div> 
        <table id="expense-table">
            <thead>
                <tr>
                    <th>Expense Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="expense-list">
                <!-- <tr>
                    <td>rwefwe</td>
                    <td>ewfewfew</td>
                    <td>feef</td>
                    <td>efewf</td>
                </tr> -->
            </tbody>
        </table>
    </section>
    <script src="app.js"></script>
</body>
</html>
